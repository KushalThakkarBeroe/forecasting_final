# Normally AUTO-GENERATED by src/scripts/scaffold_config.py from
# data/external/{commodity_id}/{commodity_id}_ext_var.xlsx — you only
# hand-edit this if you need to drop/add a candidate column before
# feature_selection.py runs (e.g. excluding a driver you know is bad
# before spending compute narrowing it down).
#
# File layout this was generated from: column 1 = date, column 2 =
# commodity's own price, column 3 onward = candidate drivers, identified
# by position (header text alone is not reliable).
#
# Lag: dynamic per driver, not fixed. Each driver's lag is chosen
# independently within lag_search_range by correlation — see
# src/data/external_driver_loader.py.

commodity_id: example_commodity
data_file: data/external/example_commodity/example_commodity_ext_var.xlsx
sheet_name: Sheet1
header_rows: 4              # auto-detected by scaffold_config.py
date_column: 1
price_column: 2

lag_search_range: [1, 3]

candidate_drivers:
  - column: 3
    label: "Candidate Driver 1"
    unit: TBD
  - column: 4
    label: "Candidate Driver 2"
    unit: TBD
  # ... one entry per column present in the file, auto-populated

min_sample_size: null

feedstock_margin_spread:
  enabled: false
  feedstock_driver_column: null
